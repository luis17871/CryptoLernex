# Kronos Lab next to other services (e.g. Frigate) on a Linux box.
#   docker compose -f deploy/docker-compose.yml up -d --build
# Dashboard: http://<host-ip>:8010
services:
  kronos-lab:
    build: ..
    container_name: kronos-lab
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      KRONOS_ENGINE: auto            # Kronos; falls back to the baseline if weights can't load
      KRONOS_MODEL: kronos-small
      KRONOS_SAMPLES: "50"           # paths per forecast (100 = like the viral panel, 2x CPU)
      KRONOS_INTERVAL: 1h
      KRONOS_AUTO_SYMBOLS: BTCUSDT,SOLUSDT   # automatic rounds for each
      KRONOS_TRACKS: "24:1,4:4"      # 24 h forecast every hour + 4 h forecast every 4 h
      KRONOS_PAPER: "1"              # daily paper trading of LightGBM + derivatives (http://<host>:8010/paper)
      KRONOS_PAPER_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT,AVAXUSDT,LTCUSDT
      KRONOS_TORCH_THREADS: "2"
      HF_HOME: /cache/huggingface
      HF_HUB_DISABLE_XET: "1"       # plain HTTPS download; the xet transfer can stall
    volumes:
      - kronos-data:/app/data        # rounds and track record (SQLite)
      - kronos-cache:/cache          # model weights, downloaded once
    # Keep Frigate responsive: cap CPU and run at low priority.
    cpus: 2.0
    mem_limit: 3g
    cpu_shares: 256
volumes:
  kronos-data:
  kronos-cache:
