name: forward-test

# Live, out-of-sample test: every 6 hours record a Kronos forecast for the newest closed
# BTCUSDT 1h candle (plus the bootstrap baseline) and re-grade all past rounds.
on:
  schedule:
    - cron: "8 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas einops huggingface_hub safetensors tqdm httpx
      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: weights
          key: kronos-small-v1
      - name: Download weights
        run: test -f weights/kronos-small/model/config.json || python scripts/download_weights.py kronos-small ./weights
      - name: Forecast + grade
        env:
          KRONOS_WEIGHTS_DIR: weights/kronos-small
        run: |
          python -m app.forward step
          python -m app.forward report
      - name: Commit results
        run: |
          git config user.name "kronos-forward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/forward
          git diff --cached --quiet && exit 0
          git commit -m "forward-test: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
